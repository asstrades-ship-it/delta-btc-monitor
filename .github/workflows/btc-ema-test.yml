
name: BTC EMA 9 21 Test

on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: read

concurrency:
  group: btc-ema-test
  cancel-in-progress: false

jobs:
  ema-test:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore Previous EMA State
        uses: actions/cache/restore@v4
        with:
          path: btc-ema-state.json
          key: btc-ema-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            btc-ema-state-

      - name: Check Telegram Secrets
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "ERROR: Telegram secrets missing"
            exit 1
          fi

      - name: Run BTC EMA 9 21 Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node btc-ema-test.js

      - name: Save EMA State
        if: success()
        uses: actions/cache/save@v4
        with:
          path: btc-ema-state.json
          key: btc-ema-state-${{ github.run_id }}-${{ github.run_attempt }}
